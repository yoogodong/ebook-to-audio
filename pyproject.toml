[project]
name = "ebook-to-audio"
version = "0.1.0"
description = "文本转音频工具，使用 Edge TTS 服务将文本文件转换为 MP3 音频文件"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.13"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "edge-tts>=7.3.1",
    "pyqt5>=5.15.10",
]

[project.scripts]
ebook-to-audio = "ebook_to_audio.main:main"
ebook-to-audio-gui = "ebook_to_audio.gui.app:run_gui"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.py"]

